<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Söylemez Bestellung - Sipariş Sistemi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .active-tab {
            border-bottom: 3px solid #ef4444;
            color: #ef4444;
            font-weight: bold;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen pb-24">

    <!-- Header -->
    <header class="bg-red-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold">Söylemez Bestellung</h1>
                <p class="text-xs text-red-100">Restoran & Market Sipariş Portalı</p>
            </div>
            <div id="cart-badge" class="bg-white text-red-600 px-3 py-1 rounded-full font-bold text-sm shadow">
                <i class="fa-solid fa-cart-shopping mr-1"></i> <span id="total-count">0</span> Ürün
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-4 mt-6">
        
        <!-- Tab Navigation (Restoran vs Market) -->
        <div class="flex border-b border-gray-200 bg-white rounded-t-lg shadow-sm mb-6">
            <button id="tab-restoran" onclick="switchTab('restoran')" class="flex-1 py-4 text-center font-medium text-lg active-tab flex items-center justify-center gap-2">
                <i class="fa-solid fa-utensils"></i> Restoran Siparişi
            </button>
            <button id="tab-market" onclick="switchTab('market')" class="flex-1 py-4 text-center font-medium text-lg text-gray-500 hover:text-gray-700 flex items-center justify-center gap-2">
                <i class="fa-solid fa-store"></i> Market Siparişi
            </button>
        </div>

        <!-- RESTORAN SEKMESİ -->
        <section id="section-restoran" class="space-y-6">
            <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-100 mb-4">
                <h2 class="text-xl font-bold text-gray-800 flex items-center gap-2 mb-1">
                    <i class="fa-solid fa-utensils text-red-500"></i> Restoran Menüsü
                </h2>
                <p class="text-sm text-gray-500">Sıcak yemekler, ızgaralar ve içecekler</p>
            </div>

            <div id="restoran-items" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Restoran ürünleri JavaScript ile yüklenecek -->
            </div>
        </section>

        <!-- MARKET SEKMESİ -->
        <section id="section-market" class="space-y-6 hidden">
            <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-100 mb-4">
                <h2 class="text-xl font-bold text-gray-800 flex items-center gap-2 mb-1">
                    <i class="fa-solid fa-store text-blue-500"></i> Market Ürünleri
                </h2>
                <p class="text-sm text-gray-500">Gıda, şarküteri ve günlük temel ihtiyaçlar</p>
            </div>

            <div id="market-items" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Market ürünleri JavaScript ile yüklenecek -->
            </div>
        </section>

    </main>

    <!-- Sabit Sipariş Özeti Barı (Alt Kısımda) -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-lg p-4 z-40">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div>
                <p class="text-xs text-gray-500">Toplam Tutar</p>
                <p class="text-2xl font-bold text-gray-800" id="total-price">0.00 €</p>
            </div>
            <button onclick="openOrderModal()" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-lg shadow flex items-center gap-2">
                <i class="fa-brands fa-whatsapp text-xl"></i> Siparişi Tamamla
            </button>
        </div>
    </div>

    <!-- Sipariş Onay Modalı -->
    <div id="order-modal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-xl max-w-md w-full p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto">
            <button onclick="closeOrderModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-xl">
                <i class="fa-solid fa-xmark"></i>
            </button>
            
            <h3 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-receipt text-red-500"></i> Sipariş Özeti
            </h3>

            <div id="modal-cart-summary" class="divide-y divide-gray-100 mb-4">
                <!-- Sepet içeriği buraya gelecek -->
            </div>

            <div class="space-y-3 mb-6">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Ad Soyad / Müşteri Adı</label>
                    <input type="text" id="customer-name" placeholder="Adınızı giriniz" class="w-full border border-gray-300 p-2.5 rounded-lg text-sm focus:outline-none focus:border-red-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Adres / Masa No / Not</label>
                    <textarea id="customer-note" rows="2" placeholder="Adres veya sipariş notunuzu yazınız" class="w-full border border-gray-300 p-2.5 rounded-lg text-sm focus:outline-none focus:border-red-500"></textarea>
                </div>
            </div>

            <div class="flex justify-between items-center mb-6 pt-3 border-t">
                <span class="font-bold text-gray-700">Toplam:</span>
                <span id="modal-total-price" class="text-2xl font-bold text-red-600">0.00 €</span>
            </div>

            <button onclick="sendOrderWhatsApp()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg flex items-center justify-center gap-2 text-base shadow">
                <i class="fa-brands fa-whatsapp text-2xl"></i> WhatsApp ile Gönder
            </button>
        </div>
    </div>

    <script>
        // Ürün Listeleri
        const products = {
            restoran: [
                { id: 'r1', name: 'Adana Kebap Porsiyon', price: 14.50, desc: 'Özel baharatlı kıyma kebabı, pilav ve salata ile' },
                { id: 'r2', name: 'Tavuk Şiş Porsiyon', price: 12.00, desc: 'Marine edilmiş tavuk göğsü, pilav ile' },
                { id: 'r3', name: 'Lahmacun', price: 4.50, desc: 'Çıtır hamur üzeri özel kıyma harcı' },
                { id: 'r4', name: 'Döner Dürüm', price: 7.50, desc: 'Lavaş arası özel soslu yaprak döner' },
                { id: 'r5', name: 'Kola / Fanta (0.33l)', price: 2.50, desc: 'Soğuk meşrubat' },
                { id: 'r6', name: 'Ayran', price: 1.80, desc: 'Geleneksel yayık ayranı' }
            ],
            market: [
                { id: 'm1', name: 'Anzer Balı 500g', price: 18.90, desc: 'Süzme doğal çiçek balı' },
                { id: 'm2', name: 'Kars Gravyer Peyniri 1kg', price: 22.00, desc: 'Geleneksel dinlendirilmiş peynir' },
                { id: 'm3', name: 'Rize Çayı 1kg', price: 8.50, desc: 'Siyah dökme çay' },
                { id: 'm4', name: 'Kayseri Mantısı 500g', price: 6.50, desc: 'El yapımı dondurulmuş mantı' },
                { id: 'm5', name: 'Türk Kahvesi 250g', price: 4.00, desc: 'Taze çekilmiş orta kavrulmuş' },
                { id: 'm6', name: 'Zeytinyağı Soğuk Sıkım 1L', price: 12.50, desc: 'Extra natürel sızma zeytinyağı' }
            ]
        };

        let cart = {};

        // Sayfa yüklendiğinde ürünleri oluştur
        document.addEventListener('DOMContentLoaded', () => {
            renderProducts('restoran', 'restoran-items');
            renderProducts('market', 'market-items');
        });

        // Ürün kartlarını HTML'e bas
        function renderProducts(type, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = products[type].map(p => `
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center hover:shadow-md transition">
                    <div class="pr-2">
                        <h3 class="font-bold text-gray-800 text-base">${p.name}</h3>
                        <p class="text-xs text-gray-500 mt-0.5 line-clamp-2">${p.desc}</p>
                        <p class="font-bold text-red-600 mt-2">${p.price.toFixed(2)} €</p>
                    </div>
                    <div class="flex items-center gap-2 bg-gray-50 p-1.5 rounded-lg border border-gray-200">
                        <button onclick="updateCart('${p.id}', -1, '${type}')" class="w-8 h-8 rounded-md bg-white text-gray-700 shadow-sm font-bold flex items-center justify-center hover:bg-gray-100">-</button>
                        <span id="qty-${p.id}" class="w-6 text-center font-bold text-sm">0</span>
                        <button onclick="updateCart('${p.id}', 1, '${type}')" class="w-8 h-8 rounded-md bg-red-600 text-white shadow-sm font-bold flex items-center justify-center hover:bg-red-700">+</button>
                    </div>
                </div>
            `).join('');
        }

        // Sekme Değiştirme
        function switchTab(tab) {
            const tabRestoran = document.getElementById('tab-restoran');
            const tabMarket = document.getElementById('tab-market');
            const secRestoran = document.getElementById('section-restoran');
            const secMarket = document.getElementById('section-market');

            if (tab === 'restoran') {
                tabRestoran.classList.add('active-tab');
                tabRestoran.classList.remove('text-gray-500');
                tabMarket.classList.remove('active-tab');
                tabMarket.classList.add('text-gray-500');

                secRestoran.classList.remove('hidden');
                secMarket.classList.add('hidden');
            } else {
                tabMarket.classList.add('active-tab');
                tabMarket.classList.remove('text-gray-500');
                tabRestoran.classList.remove('active-tab');
                tabRestoran.classList.add('text-gray-500');

                secMarket.classList.remove('hidden');
                secRestoran.classList.add('hidden');
            }
        }

        // Sepet Güncelleme
        function updateCart(productId, change, category) {
            if (!cart[productId]) {
                const allProds = [...products.restoran, ...products.market];
                const prod = allProds.find(p => p.id === productId);
                cart[productId] = { ...prod, qty: 0, category: category };
            }

            cart[productId].qty += change;

            if (cart[productId].qty <= 0) {
                delete cart[productId];
            }

            // Arayüzü güncelle
            document.getElementById(`qty-${productId}`).innerText = cart[productId] ? cart[productId].qty : 0;
            calculateTotal();
        }

        // Toplam Hesaplama
        function calculateTotal() {
            let total = 0;
            let count = 0;

            Object.values(cart).forEach(item => {
                total += item.price * item.qty;
                count += item.qty;
            });

            document.getElementById('total-price').innerText = total.toFixed(2) + ' €';
            document.getElementById('modal-total-price').innerText = total.toFixed(2) + ' €';
            document.getElementById('total-count').innerText = count;
        }

        // Modalı Aç
        function openOrderModal() {
            if (Object.keys(cart).length === 0) {
                alert('Lütfen önce sepete ürün ekleyiniz.');
                return;
            }

            const summaryContainer = document.getElementById('modal-cart-summary');
            let html = '';

            let restoranItems = Object.values(cart).filter(i => i.category === 'restoran');
            let marketItems = Object.values(cart).filter(i => i.category === 'market');

            if (restoranItems.length > 0) {
                html += `<div class="py-2 text-xs font-bold text-red-600 uppercase tracking-wider">-- Restoran Siparişleri --</div>`;
                restoranItems.forEach(item => {
                    html += `
                        <div class="py-2 flex justify-between items-center text-sm">
                            <div>
                                <span class="font-bold">${item.qty}x</span> ${item.name}
                            </div>
                            <span class="font-semibold text-gray-700">${(item.price * item.qty).toFixed(2)} €</span>
                        </div>
                    `;
                });
            }

            if (marketItems.length > 0) {
                html += `<div class="py-2 text-xs font-bold text-blue-600 uppercase tracking-wider mt-2">-- Market Siparişleri --</div>`;
                marketItems.forEach(item => {
                    html += `
                        <div class="py-2 flex justify-between items-center text-sm">
                            <div>
                                <span class="font-bold">${item.qty}x</span> ${item.name}
                            </div>
                            <span class="font-semibold text-gray-700">${(item.price * item.qty).toFixed(2)} €</span>
                        </div>
                    `;
                });
            }

            summaryContainer.innerHTML = html;
            document.getElementById('order-modal').classList.remove('hidden');
        }

        // Modalı Kapat
        function closeOrderModal() {
            document.getElementById('order-modal').classList.add('hidden');
        }

        // WhatsApp Mesajı Gönder
        function sendOrderWhatsApp() {
            const name = document.getElementById('customer-name').value.trim();
            const note = document.getElementById('customer-note').value.trim();

            if (!name) {
                alert('Lütfen adınızı giriniz.');
                return;
            }

            let message = `*SÖYLEMEZ SIPARIS PORTALI*\n\n`;
            message += `*Müşteri:* ${name}\n`;
            if (note) message += `*Not/Adres:* ${note}\n`;
            message += `-----------------------------\n`;

            let restoranItems = Object.values(cart).filter(i => i.category === 'restoran');
            let marketItems = Object.values(cart).filter(i => i.category === 'market');

            if (restoranItems.length > 0) {
                message += `\n*🍽 RESTORAN SIPARISLERI:*\n`;
                restoranItems.forEach(i => {
                    message += `• ${i.qty}x ${i.name} - ${(i.price * i.qty).toFixed(2)}€\n`;
                });
            }

            if (marketItems.length > 0) {
                message += `\n*🛒 MARKET SIPARISLERI:*\n`;
                marketItems.forEach(i => {
                    message += `• ${i.qty}x ${i.name} - ${(i.price * i.qty).toFixed(2)}€\n`;
                });
            }

            let totalPrice = Object.values(cart).reduce((sum, i) => sum + (i.price * i.qty), 0);
            message += `\n-----------------------------\n`;
            message += `*TOPLAM TUTAR: ${totalPrice.toFixed(2)} €*`;

            const encodedMessage = encodeURIComponent(message);
            // Telefon numaranızı buraya yazabilirsiniz (Örn: 491234567890)
            const phoneNumber = ""; 
            
            window.open(`https://wa.me/${phoneNumber}?text=${encodedMessage}`, '_blank');
        }
    </script>
</body>
</html>
