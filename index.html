        function renderList() {
            const listContainer = document.getElementById('item-list');
            const search = document.getElementById('search').value.toLowerCase();
            listContainer.innerHTML = '';

            const filtered = products.filter(p => p.name.toLowerCase().includes(search) || p.nr.includes(search));

            if (filtered.length === 0) {
                listContainer.innerHTML = `<div class="text-center text-gray-400 py-8">Aranan ürün bulunamadı.</div>`;
                return;
            }

            filtered.forEach(p => {
                const qty = cart[p.nr] || 0;
                const div = document.createElement('div');
                div.className = 'flex justify-between items-center border border-gray-100 p-3 rounded-xl text-sm bg-gray-50 hover:bg-white transition shadow-sm';
                div.innerHTML = `
                    <div class="flex-1 pr-2">
                        <span class="text-[11px] font-mono text-gray-400 font-bold">[${p.nr}]</span>
                        <div class="font-semibold text-gray-800 leading-tight">${p.name}</div>
                        <div class="text-xs text-blue-600 font-medium mt-0.5">${p.price ? p.price.toFixed(2) + ' € / ' + p.unit : ''}</div>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="updateQty('${p.nr}', -1)" class="w-8 h-8 bg-gray-200 hover:bg-gray-300 rounded-lg text-lg font-bold flex items-center justify-center text-gray-700 active:scale-90">-</button>
                        <span class="w-7 text-center font-bold text-gray-800 text-sm">${qty}</span>
                        <button onclick="updateQty('${p.nr}', 1)" class="w-8 h-8 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-lg font-bold flex items-center justify-center active:scale-90">+</button>
                    </div>
                `;
                listContainer.appendChild(div);
            });
        }

        function updateQty(nr, delta) {
            const current = cart[nr] || 0;
            const updated = current + delta;
            if (updated <= 0) delete cart[nr];
            else cart[nr] = updated;
            updateCartCount();
            renderList();
        }

        function updateCartCount() {
            let totalQty = 0;
            let totalPrice = 0;

            Object.keys(cart).forEach(nr => {
                const qty = cart[nr];
                const item = products.find(p => p.nr === nr);
                if (item && item.price) {
                    totalQty += qty;
                    totalPrice += qty * item.price;
                }
            });

            document.getElementById('cart-count').innerText = totalQty;
            document.getElementById('cart-total').innerText = totalPrice.toFixed(2) + ' €';
        }

        function filterItems() { renderList(); }

        function sendOrder() {
            const company = document.getElementById('company-name').value.trim();
            if (!company) { alert('Lütfen Firma / İşletme Adınızı giriniz.'); return; }

            const keys = Object.keys(cart);
            if (keys.length === 0) { alert('Lütfen sipariş listenize en az bir ürün ekleyiniz.'); return; }

            let text = `🧾 *SÖYLEMEZ UNTERNEHMEN*\n`;
            text += `*Sipariş Formu / Bestellformular*\n`;
            text += `──────────────────────\n`;
            text += `🏢 *Firma:* ${company}\n`;
            text += `📅 *Tarih:* ${new Date().toLocaleDateString('de-DE')}\n`;
            text += `──────────────────────\n`;
            text += `📦 *SİPARİŞ DETAYLARI:*\n\n`;

            let grandTotal = 0;

            keys.forEach(nr => {
                const item = products.find(p => p.nr === nr);
                const qty = cart[nr];
                const itemTotal = qty * (item.price || 0);
                grandTotal += itemTotal;

                text += `▫️ \`[${item.nr}]\` ${item.name}\n`;
                text += `   └ *${qty} ${item.unit}* ${item.price ? 'x ' + item.price.toFixed(2) + ' € = *' + itemTotal.toFixed(2) + ' €*' : ''}\n\n`;
            });

            text += `──────────────────────\n`;
            text += `💰 *GENEL TOPLAM:* *${grandTotal.toFixed(2)} €*\n`;

            const note = document.getElementById('order-note').value.trim();
            if (note) {
                text += `💬 *Not:* ${note}\n`;
            }
            text += `──────────────────────`;

            window.open(`https://wa.me/${phone}?text=${encodeURIComponent(text)}`, '_blank');
        }
